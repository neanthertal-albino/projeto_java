spring.application.name=budgeting-ai-local

# Banco em memoria: nada de Docker, nada de MySQL.
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Os modelos de IA desta versao sao LOCAIS (sem chave, sem internet).
# Depois, troque os beans de infrastructure/ai pelos modelos reais do Spring AI.
