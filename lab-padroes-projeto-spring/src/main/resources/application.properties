spring.application.name=lab-padroes-projeto-spring

# Banco H2 em memoria (some quando a aplicacao para)
spring.datasource.url=jdbc:h2:mem:labpadroes
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update

# Console web do H2: acesse http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
